<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b19"><title>THEORY ARENA · Yessenov</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#080b19;--panel:#11182b;--panel2:#151f37;--line:#ffffff18;--muted:#9eacc7;--white:#f5f7ff;--mint:#53f0bd;--violet:#a78bfa;--pink:#ff719d;--gold:#ffd477}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);font-family:Manrope,system-ui;background:radial-gradient(ellipse at 12% 5%,#203d5a 0,transparent 34%),radial-gradient(ellipse at 90% 15%,#38205f 0,transparent 30%),radial-gradient(ellipse at 50% 100%,#102b34 0,transparent 38%),var(--bg)}
button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;color:var(--muted);font-size:11px;letter-spacing:2px;font-weight:800}.brand{display:flex;align-items:center;gap:10px;color:white;font:700 16px 'Space Grotesk';letter-spacing:.5px}.brandmark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--mint),#6a8cff);color:#07121b;font-weight:900}.live{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 14px var(--mint)}
.card{max-width:820px;margin:34px auto;padding:clamp(22px,5vw,46px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#17233beF,#101629f5);box-shadow:0 28px 90px #0007;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--mint),var(--violet),transparent);opacity:.8}.wide{max-width:1000px}.eyebrow{color:var(--mint);font-size:11px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}.muted{color:var(--muted);line-height:1.7}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(34px,7vw,66px)/1.02 'Space Grotesk';letter-spacing:-2px;margin:20px 0}h2{font:700 clamp(25px,4vw,40px)/1.15 'Space Grotesk';letter-spacing:-1px;margin:12px 0 18px}h3{font:700 20px 'Space Grotesk'}
.accent{background:linear-gradient(90deg,var(--mint),#b9a4ff);-webkit-background-clip:text;background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{border:1px solid var(--line);border-radius:20px;padding:20px;background:#ffffff06}.btn{border:0;border-radius:15px;padding:16px 20px;min-height:56px;font-weight:900;cursor:pointer;color:#07131a;background:linear-gradient(110deg,var(--mint),#7be8d2);box-shadow:0 10px 30px #43e8b322;transition:transform .15s,filter .15s}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{color:white;background:#ffffff10;border:1px solid var(--line);box-shadow:none}.btn.pink{color:white;background:linear-gradient(110deg,#ff719d,#df5cba)}.btn.violet{color:white;background:linear-gradient(110deg,#9b8bff,#6f73e8)}.btn.full{width:100%}input{width:100%;padding:16px;border-radius:14px;border:1px solid #ffffff28;background:#090f20;color:white;margin:8px 0 14px;outline:none}input:focus{border-color:var(--mint)}.label{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:800}.pin{font:700 clamp(42px,9vw,64px) 'Space Grotesk';letter-spacing:9px;text-align:center;color:var(--gold);padding:10px}.qr{display:block;width:190px;height:190px;object-fit:contain;background:white;padding:8px;border-radius:18px;margin:16px auto}.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stat{border:1px solid var(--line);background:#ffffff08;padding:14px 17px;border-radius:16px;min-width:110px}.stat strong{display:block;font:700 25px 'Space Grotesk';color:var(--mint)}.stat small{color:var(--muted);font-size:10px;letter-spacing:1px}.people{display:grid;gap:8px;margin:14px 0}.person{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#ffffff08;border:1px solid var(--line);padding:12px 14px;border-radius:14px}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#a78bfa25;color:#c7b6ff;font-weight:900}.person b{font-size:14px}.person span{font-size:12px;color:var(--muted)}.bar{height:7px;background:#ffffff12;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--violet));border-radius:10px}.answergrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}.answer{min-height:132px;border-radius:23px;font:800 clamp(25px,4vw,38px) 'Space Grotesk';display:flex;align-items:center;justify-content:center;gap:12px}.yes{background:linear-gradient(145deg,#4cf0b8,#13a987);color:#04251e;box-shadow:0 16px 40px #19d9a42c}.no{background:linear-gradient(145deg,#ff829f,#d94e78);color:white;box-shadow:0 16px 40px #e74b7a2c}.question{font:700 clamp(25px,4.5vw,43px)/1.25 'Space Grotesk';margin:28px 0 18px;letter-spacing:-.8px}.progress{height:6px;border-radius:10px;background:#ffffff15;overflow:hidden;margin:16px 0 26px}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--mint),var(--violet));transition:width .3s}.timer{display:flex;align-items:center;gap:12px}.clock{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--mint);font:700 20px 'Space Grotesk';color:var(--mint);box-shadow:0 0 24px #4cf0b822}.clock.low{border-color:var(--pink);color:var(--pink)}.feedback{font-size:13px;color:var(--muted);margin-top:18px}.rank{font:700 18px 'Space Grotesk';color:var(--gold)}.score{font:700 26px 'Space Grotesk';color:var(--mint)}.foot{text-align:center;color:#71809e;font-size:10px;letter-spacing:2px;padding:28px 8px}.hide{display:none!important}
@media(max-width:650px){.wrap{padding:13px}.top{font-size:9px}.brand{font-size:13px}.card{margin:20px auto;border-radius:23px;padding:23px 18px}.grid,.answergrid{grid-template-columns:1fr}.answer{min-height:86px}.tile{padding:16px}.person{grid-template-columns:36px 1fr auto;padding:10px}.avatar{width:34px;height:34px}.pin{letter-spacing:6px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><span class="brandmark">T</span> THEORY ARENA <span style="color:var(--muted)">/ YESSENOV</span></div><div class="live"><i class="dot"></i> LIVE LEARNING</div></header><main id="app"></main><footer class="foot">7 СҰРАҚ · 20 СЕКУНД · ИӘ / ЖОҚ · ЖЫЛДАМДЫҚҚА БАЙЛАНЫСТЫ ҰПАЙ</footer></div>
<script>
const app=document.getElementById('app');let role='player',session=null,roomUrl='',lastQuestion=-1,timerLoop=null;const params=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch('/theory-api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Қате');return j}
function errorBox(msg){let old=document.getElementById('error');if(!old){old=document.createElement('div');old.id='error';old.className='tile';old.style.borderColor='var(--pink)';app.prepend(old)}old.textContent=msg}
function action(label,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
async function createRoom(){try{role='host';session=await api('create',{});roomUrl=session.joinUrl;hostLobby()}catch(e){errorBox(e.message)}}
async function joinRoom(){try{const pin=document.getElementById('pin').value.trim(),name=document.getElementById('name').value.trim();session=await api('join',{pin,name});role='player';playerWait()}catch(e){errorBox(e.message)}}
function home(){role='player';app.innerHTML='<section class="card"><div class="eyebrow">PEDAGOGY · INTERACTIVE CHALLENGE</div><h1>ОЙЛА. <span class="accent">ТАҢДА.</span><br>ЖЕҢІСКЕ ЖЕТ.</h1><p class="muted">Оқытудың шетелдік тұжырымдамалары бойынша 7 тұжырым. Әр сұраққа 20 секунд беріледі. Дұрыс әрі жылдам жауап берген сайын ұпайың жоғары болады.</p><div class="grid"><div class="tile"><div class="eyebrow">HOST MODE</div><h3>Жүргізуші</h3><p class="muted">Бөлме аш, QR-кодты көрсет және рейтингті нақты уақытта бақыла.</p>'+action('＋ БӨЛМЕ АШУ','createRoom()','full')+'</div><div class="tile"><div class="eyebrow">PLAYER MODE</div><h3>Қатысушы</h3><p class="muted">QR-кодпен кір немесе PIN мен есіміңді жаз.</p><input id="pin" inputmode="numeric" placeholder="6 таңбалы PIN" maxlength="6" value="'+esc(params.get('pin')||'')+'"><input id="name" placeholder="Есімің"><button class="btn full violet" onclick="joinRoom()">ОЙЫНҒА ҚОСЫЛУ →</button></div></div></section>'}
function hostLobby(){app.innerHTML='<section class="card center"><div class="eyebrow">ROOM CREATED · КҮТУ БӨЛМЕСІ</div><h2>Қатысушыларды <span class="accent">шақыр!</span></h2><div class="pin">'+session.pin+'</div><img class="qr" alt="Қосылу QR коды" src="https://quickchart.io/qr?size=260&text='+encodeURIComponent(roomUrl)+'"><p class="muted">'+esc(roomUrl)+'</p><div class="row" style="justify-content:center"><div class="stat"><strong id="count">0</strong><small>ҚАТЫСУШЫ</small></div><div class="stat"><strong>20 сек</strong><small>ӘР СҰРАҚҚА</small></div><div class="stat"><strong>7</strong><small>СҰРАҚ</small></div></div><div class="tile" style="text-align:left;margin-top:20px"><div class="eyebrow">ҚОСЫЛҒАНДАР</div><div id="people" class="people"><p class="muted">Қатысушылар күтілуде...</p></div></div><button class="btn full" onclick="startGame()">▶ ОЙЫНДЫ БАСТАУ</button><p class="muted">Әр қатысушы жауап берген бойда өз келесі сұрағына өтеді. Басқа қатысушыларды күтпейді.</p></section>';pollHost()}
async function startGame(){try{await api('start',{pin:session.pin,token:session.token});hostActive()}catch(e){errorBox(e.message)}}
function hostActive(){app.innerHTML='<section class="card wide"><div class="row"><div><div class="eyebrow">LIVE CONTROL ROOM</div><h2>Ойын барысы</h2></div><div class="stat"><strong id="count">0</strong><small>ҚАТЫСУШЫ</small></div></div><div class="grid"><div class="tile"><div class="label">ЖАЛПЫ ҚАТЫСУШЫ</div><h2 id="total">0</h2></div><div class="tile"><div class="label">7 СҰРАҚТЫ АЯҚТАҒАН</div><h2 id="done">0</h2></div></div><div class="eyebrow" style="margin-top:25px">НАҚТЫ УАҚЫТТАҒЫ РЕЙТИНГ · TOP 10</div><div id="people" class="people"></div><button class="btn pink full" onclick="finishGame()">ҚОРЫТЫНДЫНЫ ЖАРИЯЛАУ</button></section>';pollHost()}
function renderPeople(players){return (players||[]).sort((a,b)=>b.score-a.score||b.correct-a.correct).map((x,i)=>'<div class="person"><div class="avatar">'+(i+1)+'</div><div><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+Math.round(x.progress/7*100)+'%"></i></div><span>'+x.progress+'/7 сұрақ · '+(x.done?'Аяқтады':'Қалғаны: '+x.remaining+' сек')+'</span></div><div style="text-align:right"><div class="score">'+x.score+'</div><span>ұпай</span></div></div>').join('')||'<p class="muted">Әзірге қатысушы жоқ.</p>'}
async function pollHost(){if(!session||role!=='host')return;try{const s=await api('state?pin='+session.pin+'&role=host&token='+session.token);const p=document.getElementById('people');if(p)p.innerHTML=renderPeople(s.players);const c=document.getElementById('count'),t=document.getElementById('total'),d=document.getElementById('done');if(c)c.textContent=s.participantCount;if(t)t.textContent=s.participantCount;if(d)d.textContent=(s.players||[]).filter(x=>x.done).length;if(s.phase==='finished'){hostResults(s);return}}catch(e){}setTimeout(pollHost,1000)}
async function finishGame(){try{await api('finish',{pin:session.pin,token:session.token});const s=await api('state?pin='+session.pin+'&role=host&token='+session.token);hostResults(s)}catch(e){errorBox(e.message)}}
function hostResults(s){app.innerHTML='<section class="card wide"><div class="center"><div class="eyebrow">THEORY ARENA · FINAL RESULTS</div><div style="font-size:58px;margin:14px">🏆</div><h1>ЖЕҢІМПАЗ <span class="accent">АНЫҚТАЛДЫ</span></h1></div><div id="people" class="people">'+(s.ranking||[]).map(x=>'<div class="person"><div class="rank">#'+x.rank+'</div><div><b>'+esc(x.name)+'</b><span>'+x.correct+' дұрыс жауап · '+(x.done?'7/7 аяқтады':x.progress+'/7 жауап')+'</span></div><div class="score">'+x.score+' ұпай</div></div>').join('')+'</div><button class="btn secondary full" onclick="location.href=location.pathname">ЖАҢА ОЙЫН</button></section>'}
function playerWait(){lastQuestion=-1;app.innerHTML='<section class="card center"><div class="eyebrow">YOU ARE IN · ҚОСЫЛДЫҢ</div><div style="font-size:48px;margin:18px">✦</div><h2>Қош келдің, <span class="accent">'+esc(session.name)+'</span>!</h2><div class="pin">'+session.pin+'</div><p class="muted">Жүргізуші ойынды бастағанша күте тұр. Басталған сәтте сұрақ автоматты ашылады.</p><div class="dot" style="margin:20px auto"></div></section>';pollPlayer()}
async function pollPlayer(){if(!session||role!=='player')return;try{const s=await api('state?pin='+session.pin+'&role=player&token='+session.token);if(s.phase==='finished'){playerFinished(s);return}if(s.phase==='active'){if(s.personal.done){playerDone(s);return}if(lastQuestion!==s.personal.index)playerQuestion(s);else updateClock(s.personal.deadline);}}catch(e){errorBox(e.message)}setTimeout(pollPlayer,500)}
function playerQuestion(s){lastQuestion=s.personal.index;const q=s.personal.question;app.innerHTML='<section class="card"><div class="row"><div><div class="eyebrow">QUESTION '+String(q.number).padStart(2,'0')+' / 7</div><div class="muted">'+(q.level==='easy'?'🟢 ОҢАЙ':q.level==='medium'?'🟡 ОРТАША':'🔴 ҚИЫН')+' · Оқытудың шетелдік тұжырымдамалары</div></div><div class="timer"><div class="clock" id="clock">20</div><div><div class="score" id="score">'+s.personal.score+'</div><small class="muted">ЖИНАЛҒАН ҰПАЙ</small></div></div></div><div class="progress"><i style="width:'+(q.number-1)/7*100+'%"></i></div><div class="question">'+esc(q.text)+'</div><p class="muted">Тұжырым дұрыс па? 20 секунд ішінде таңда. Жылдам жауап — көбірек ұпай!</p><div class="answergrid"><button id="yes" class="btn answer yes" onclick="answer(true)">✓ ИӘ</button><button id="no" class="btn answer no" onclick="answer(false)">✕ ЖОҚ</button></div><div class="feedback">Дұрыс жауап: 500–1000 ұпай · Уақыт біткенде келесі сұрақ автоматты ашылады.</div></section>';updateClock(s.personal.deadline)}
function updateClock(deadline){const el=document.getElementById('clock');if(!el||!deadline)return;const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));el.textContent=n;if(n<=5)el.classList.add('low');if(n===0){const y=document.getElementById('yes'),no=document.getElementById('no');if(y)y.disabled=true;if(no)no.disabled=true;}}
async function answer(value){const y=document.getElementById('yes'),no=document.getElementById('no');if(y)y.disabled=true;if(no)no.disabled=true;try{const r=await api('answer',{pin:session.pin,token:session.token,answer:value});app.innerHTML='<section class="card center"><div class="eyebrow">ANSWER RECEIVED</div><div style="font-size:58px;margin:16px">'+(r.correct?'⚡':'✦')+'</div><h2>'+(r.correct?'ДҰРЫС ЖАУАП!':'КЕЛЕСІДЕ СӘТТІЛІК!')+'</h2><p class="muted">'+esc(r.explanation)+'</p><div class="score">+'+r.points+' ұпай</div><p class="muted">Жалпы ұпай: '+r.score+' · '+esc(r.source)+'</p><div class="dot" style="margin:18px auto"></div></section>';lastQuestion=-1;setTimeout(pollPlayer,650)}catch(e){if(y)y.disabled=false;if(no)no.disabled=false;errorBox(e.message)}}
function playerDone(s){app.innerHTML='<section class="card center"><div class="eyebrow">CHALLENGE COMPLETED</div><div style="font-size:54px;margin:18px">🏁</div><h2>Жарайсың, '+esc(s.personal.name)+'!</h2><div class="score">'+s.personal.score+' ұпай</div><p class="muted">7 сұраққа жауап бердің. Қорытынды рейтинг жүргізуші экранында көрсетіледі.</p></section>';setTimeout(pollPlayer,1800)}
function playerFinished(s){app.innerHTML='<section class="card center"><div class="eyebrow">FINAL SCORE</div><div style="font-size:55px;margin:16px">🎉</div><h2>'+esc(s.personal.name)+'</h2><div class="score">'+s.personal.score+' ұпай</div><p class="muted">Дұрыс жауап: '+s.personal.correct+' / 7</p><h3>Жалпы рейтингте: #'+((s.ranking||[]).find(x=>x.name===s.personal.name)?.rank||'—')+'</h3></section>'}
if(location.pathname==='/theory/join'||location.pathname==='/theory')home();else home();
</script></body></html>
