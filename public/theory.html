<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b2d"><title>Оқыту теориялары · Иә / Жоқ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
:root{--bg:#0d0826;--panel:#201644;--muted:#b9acd8;--green:#36e4aa;--purple:#a77aff;--red:#ff6f88;--gold:#ffd16a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(ellipse at 80% 0%,#39206b,transparent 38%),radial-gradient(ellipse at 0% 80%,#192d56,transparent 35%),var(--bg);font-family:Manrope,system-ui}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:1px}.logo{font:700 18px 'Space Grotesk';color:white}.card{margin:45px auto;padding:clamp(22px,5vw,42px);max-width:760px;border:1px solid #ffffff25;border-radius:26px;background:linear-gradient(135deg,#24194edc,#11102fe8);box-shadow:0 30px 90px #0005}.tag{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:800}h1{font:700 clamp(32px,7vw,60px)/1.08 'Space Grotesk';margin:18px 0}h2{font:700 clamp(25px,5vw,38px)/1.2 'Space Grotesk'}p{color:var(--muted);line-height:1.7}.btn{border:0;border-radius:14px;padding:16px 22px;font-weight:800;cursor:pointer;background:linear-gradient(100deg,#a27aff,#714df1);color:white}.btn:disabled{opacity:.5}.green{background:linear-gradient(100deg,#26d49b,#12a979);color:#071e18}.red{background:linear-gradient(100deg,#ff8094,#e34d78)}input{width:100%;padding:16px;border-radius:12px;background:#0d0a28;color:white;border:1px solid #ffffff35;margin:8px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:100px;font-size:clamp(23px,4vw,34px)}.muted{color:var(--muted)}.pin{font:700 52px 'Space Grotesk';letter-spacing:7px;color:var(--gold);text-align:center}.qr{display:block;width:190px;height:190px;object-fit:contain;background:white;padding:8px;border-radius:12px;margin:15px auto}.players{display:grid;gap:8px;margin:16px 0}.person{display:flex;justify-content:space-between;gap:12px;background:#ffffff0b;border:1px solid #ffffff18;padding:12px 15px;border-radius:12px}.notice{border:1px solid #ffffff20;border-radius:14px;padding:15px;margin:16px 0;background:#ffffff0a}.score{font:700 30px 'Space Grotesk';color:var(--green)}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions .btn{flex:1}.result{text-align:center}.winner{font-size:46px}.foot{text-align:center;color:#8578a7;font-size:11px;padding:25px}@media(max-width:600px){.wrap{padding:15px}.card{margin:25px auto}.grid{grid-template-columns:1fr}.answer{min-height:80px}.pin{font-size:42px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">YESSENOV · THEORY LAB</div><div>ИНТЕРАКТИВТІ ТАПСЫРМА</div></div><main id="app"></main><div class="foot">15 СҰРАҚ · ИӘ / ЖОҚ · ӘР ҚАТЫСУШЫ ӨЗ ҚАРҚЫНЫМЕН</div></div>
<script>
const app=document.getElementById('app');let role=location.pathname==='/theory/host'?'host':'player',session=null,roomUrl='';const params=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch('/theory-api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Қате');return j}
function showError(e){alert(e.message||'Қате');}
function action(label,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
async function createRoom(){try{role='host';session=await api('create',{});roomUrl=session.joinUrl;hostLobby();}catch(e){showError(e)}}
async function joinRoom(){try{const x=await api('join',{pin:document.getElementById('pin').value.trim(),name:document.getElementById('name').value.trim()});session=x;playerWait();}catch(e){showError(e)}}
function home(){app.innerHTML='<section class="card"><div class="tag">БІЛІМ БЕРУ ТЕОРИЯСЫ · ПЕДАГОГИКА</div><h1>ОҚЫТУДЫҢ ШЕТ ЕЛДІК <span style="color:var(--purple)">ТҰЖЫРЫМДАМАЛАРЫ</span></h1><p>Бихевиоризм, прагматизм, гуманизм және когнитивтік оқыту теориялары бойынша 15 тұжырым. Әрқайсысына «ИӘ» немесе «ЖОҚ» деп жауап бер.</p><div class="grid"><div class="notice"><div class="tag">ЖҮРГІЗУШІ</div><p>Бөлме ашып, QR-кодты қатысушыларға көрсет.</p>'+action('БӨЛМЕ ҚҰРУ','createRoom()','green')+'</div><div class="notice"><div class="tag">ҚАТЫСУШЫ</div><p>PIN-код пен есіміңді енгіз.</p><input id="pin" placeholder="6 таңбалы PIN" maxlength="6" value="'+esc(params.get('pin')||'')+'"><input id="name" placeholder="Есімің"><button class="btn green" onclick="joinRoom()">ОЙЫНҒА КІРУ</button></div></div></section>'}
function hostLobby(){app.innerHTML='<section class="card"><div class="tag">ЖҮРГІЗУШІ · ҚОСЫЛУ БӨЛМЕСІ</div><h2>Қатысушыларды шақыр</h2><div class="pin">'+session.pin+'</div><img class="qr" alt="QR код" src="https://quickchart.io/qr?size=240&text='+encodeURIComponent(roomUrl)+'" onerror="this.onerror=null;this.src=\'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(roomUrl)+'\'"><p style="text-align:center">'+esc(roomUrl)+'</p><div class="notice"><b>Қатысушылар:</b> <span id="count">0</span><div id="people" class="players"></div></div>'+action('▶ ОЙЫНДЫ БАСТАУ','startGame()','green')+'<p class="muted">Ойын басталған соң әр қатысушы 15 сұраққа жеке қарқынмен жауап береді. Біреудің жауабын күтудің қажеті жоқ.</p></section>';pollHost();}
async function pollHost(){if(!session||role!=='host')return;try{const s=await api('state?pin='+session.pin+'&role=host&token='+session.token);const c=document.getElementById('count'),p=document.getElementById('people');if(c)c.textContent=s.participantCount;if(p)p.innerHTML=(s.players||[]).map(x=>'<div class="person"><b>'+esc(x.name)+'</b><span>'+x.progress+'/15 · '+x.score+' ұпай</span></div>').join('')||'<p>Қатысушылар әлі қосылған жоқ.</p>';if(s.phase==='finished'){hostResults(s);return;}}catch(e){}setTimeout(pollHost,2500)}
async function startGame(){try{await api('start',{pin:session.pin,token:session.token});hostActive();}catch(e){showError(e)}}
function hostActive(){app.innerHTML='<section class="card"><div class="tag">ОЙЫН ЖҮРУДЕ · LIVE</div><h2>Қатысушылар өз қарқынымен жауап беріп жатыр</h2><div id="people" class="players"></div><div class="actions">'+action('НӘТИЖЕНІ ҚОРЫТЫНДЫЛАУ','finishGame()','red')+'</div></section>';pollHost();}
async function finishGame(){try{await api('finish',{pin:session.pin,token:session.token});const s=await api('state?pin='+session.pin+'&role=host&token='+session.token);hostResults(s);}catch(e){showError(e)}}
function hostResults(s){app.innerHTML='<section class="card"><div class="result"><div class="winner">🏆</div><div class="tag">ҚОРЫТЫНДЫ НӘТИЖЕ</div><h2>ЖЕҢІМПАЗ</h2><h1 style="color:var(--gold)">'+esc(s.ranking[0]?.name||'—')+'</h1><div class="score">'+(s.ranking[0]?.score||0)+' / 15</div></div><h2>Қатысушылар рейтингі</h2><div class="players">'+s.ranking.map(x=>'<div class="person"><b>#'+x.rank+' · '+esc(x.name)+'</b><span>'+x.score+'/15 · '+x.correct+' дұрыс</span></div>').join('')+'</div></section>'}
function playerWait(){app.innerHTML='<section class="card result"><div class="tag">СӘТТІ ҚОСЫЛДЫҢ</div><h2>Сәлем, '+esc(session.name)+'</h2><div class="pin">'+session.pin+'</div><p>Жүргізуші ойынды бастағанша күте тұр.</p></section>';pollPlayer();}
async function pollPlayer(){if(!session||role!=='player')return;try{const s=await api('state?pin='+session.pin+'&role=player&token='+session.token);if(s.personal?.done){if(s.phase==='finished')playerFinished(s);else playerWaitFinish(s);return;}if(s.phase==='active'){playerQuestion(s);return;}if(s.phase==='finished'){playerFinished(s);return;}}catch(e){}setTimeout(pollPlayer,1800)}
function playerQuestion(s){const q=s.personal.question;app.innerHTML='<section class="card"><div class="tag">СҰРАҚ '+q.number+' / 15</div><div class="score">'+s.personal.score+' ұпай</div><h2>'+esc(q.text)+'</h2><p>Дұрыс жауапқа 1 ұпай беріледі. Жауап берген соң келесі сұрақ бірден ашылады.</p><div class="grid"><button class="btn green answer" onclick="answer(true)">✓ ИӘ</button><button class="btn red answer" onclick="answer(false)">✕ ЖОҚ</button></div></section>'}
async function answer(value){try{const r=await api('answer',{pin:session.pin,token:session.token,answer:value});app.innerHTML='<section class="card result"><div class="tag">ЖАУАБЫҢ ҚАБЫЛДАНДЫ</div><div class="winner">'+(r.correct?'✅':'💡')+'</div><h2>'+(r.correct?'ДҰРЫС!':'ҚАТЕ ЖАУАП')+'</h2><p>'+esc(r.explanation)+'</p><small>'+esc(r.source)+'</small><div class="score">'+r.score+' ұпай</div></section>';setTimeout(()=>{if(r.next)pollPlayer();else playerDone();},900);}catch(e){showError(e)}}
async function playerDone(){try{const s=await api('state?pin='+session.pin+'&role=player&token='+session.token);playerWaitFinish(s)}catch(e){showError(e)}}
function playerWaitFinish(s){app.innerHTML='<section class="card result"><div class="winner">🏁</div><div class="tag">СЕН БАРЛЫҚ СҰРАҚҚА ЖАУАП БЕРДІҢ</div><h2>'+esc(s.personal.name)+'</h2><div class="score">'+s.personal.score+' / 15 ұпай</div><p>Жүргізуші қалған қатысушылардың аяқтауын күтіп, қорытындыны жариялайды.</p></section>';setTimeout(pollPlayer,2500)}
function playerFinished(s){app.innerHTML='<section class="card result"><div class="winner">🎉</div><div class="tag">15 СҰРАҚ АЯҚТАЛДЫ</div><h2>'+esc(s.personal.name)+'</h2><div class="score">'+s.personal.score+' / 15 ұпай</div><p>Дұрыс жауап: '+s.personal.correct+' · Қате жауап: '+(15-s.personal.correct)+'</p><p>Жүргізуші қорытындыны жариялағанша күте тұр.</p></section>';setTimeout(pollPlayer,2500)}
if(role==='host'&&params.get('pin')){home()}else home();
</script></body></html>
