<!doctype html>
<html lang="kk"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f082d"/><title>QUIZ ARENA — Педагогика Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
:root{--bg:#0d0826;--text:#fcfbff;--muted:#b6a9d6;--violet:#9460ff;--green:#39e7a9;--pink:#ff73b3;--yellow:#ffc959;--blue:#4e98ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 82% 0%,#33206e 0,transparent 35%),radial-gradient(ellipse at 5% 70%,#1d2956 0,transparent 34%),var(--bg);font-family:Manrope,system-ui,sans-serif;color:var(--text)}button,input{font:inherit}
a{color:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.54}.wrap{max-width:1180px;margin:auto;padding:0 22px}
nav{display:flex;align-items:center;justify-content:space-between;padding:25px 0 12px;gap:12px}.logo{text-decoration:none;font-size:1.2rem;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.04em}.logo b{color:var(--yellow)}.pill{border:1px solid #ffffff25;background:#ffffff0e;border-radius:20px;padding:9px 15px;color:#e9dcff;font-size:11px;font-weight:800;letter-spacing:1.5px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 14px var(--green);margin-right:6px}
main{min-height:76vh;padding:36px 0 60px}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(38px,7vw,80px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-2px}h2{font:700 clamp(28px,4vw,48px)/1.14 'Space Grotesk',sans-serif;letter-spacing:-1px}p{color:var(--muted);line-height:1.7}small{color:var(--muted)}.tag{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:16px}.grad{background:linear-gradient(110deg,#fff,#e3c8ff 45%,#bd99ff);background-clip:text;-webkit-background-clip:text;color:transparent}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;min-height:500px}.hero p{max-width:560px}.bigcard,.panel{border-radius:24px;border:1px solid #ffffff1d;background:linear-gradient(130deg,#23174dcb,#141136d9);box-shadow:0 30px 70px #06031545}.bigcard{padding:30px}.panel{padding:26px}.orb{height:125px;display:flex;justify-content:center;align-items:center;font-size:74px;background:radial-gradient(circle,#743cce88,transparent 60%);margin-bottom:8px}.form{display:grid;gap:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:800}input{width:100%;border:1px solid #ffffff30;border-radius:12px;background:#0c092db8;color:white;padding:16px;outline:none;font-size:18px}input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #9460ff22}input::placeholder{color:#8f86b1}
.btn{width:auto;display:inline-flex;justify-content:center;align-items:center;gap:10px;padding:15px 24px;border-radius:12px;background:linear-gradient(105deg,#965dff,#6e47f4);color:white;font-weight:800;box-shadow:0 12px 30px #6441e85e;transition:transform .16s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn.secondary{background:#ffffff14;box-shadow:none;border:1px solid #ffffff2b}.btn.green{background:linear-gradient(105deg,#22cb95,#17aa78);color:#081b17;box-shadow:0 10px 25px #00b6873d}.btn.block{width:100%}.btn.yell{background:linear-gradient(100deg,#ffe47f,#ffb846);color:#2b1930;box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}.tile{padding:12px;border-radius:12px;border:1px solid #ffffff1b;background:#ffffff08}.tile b{display:block;font-size:22px;font-family:'Space Grotesk'}.tile small{font-size:10px}
.stage{max-width:1080px;margin:0 auto}.step{display:flex;align-items:center;gap:10px;color:#b7a6e5;font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:20px;flex-wrap:wrap}.step span{padding:8px 12px;background:#ffffff0d;border:1px solid #ffffff20;border-radius:12px}
.lobbygrid{display:grid;grid-template-columns:350px 1fr;gap:20px}.pin{font-size:clamp(48px,9vw,78px);font-weight:800;font-family:'Space Grotesk';letter-spacing:7px;color:var(--yellow);line-height:1.1;margin:14px 0}.qr{width:176px;height:176px;background:white;border-radius:13px;padding:9px;display:block;object-fit:contain;margin:17px auto}.link{overflow-wrap:anywhere;color:#cbb7ff;font-size:13px}.namelist{display:flex;flex-wrap:wrap;gap:11px;margin:20px 0 30px}.name{border:1px solid #ffffff29;background:#ffffff11;padding:11px 16px;border-radius:999px;font-weight:700;font-size:14px}.avatar{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;background:#a68aff;color:#1d1152;margin-right:7px;font-weight:900}.empty{padding:48px 10px;text-align:center;color:var(--muted)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.clock{min-width:78px;text-align:center;padding:12px 16px;border-radius:15px;background:#201746;color:var(--yellow);font-size:30px;font-weight:800;font-family:'Space Grotesk'}.bar{height:8px;background:#ffffff1a;border-radius:99px;overflow:hidden;margin:0 0 35px}.bar>div{height:100%;background:linear-gradient(90deg,#8f5eff,#46d3f1);width:100%;transition:width .22s linear}.qtitle{text-align:center;margin:20px auto 35px;max-width:900px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{min-height:112px;display:flex;align-items:center;text-align:left;gap:15px;border:2px solid #ffffff22;border-radius:18px;color:#fff;font-weight:800;font-size:clamp(14px,2vw,19px);padding:17px;transition:transform .14s,filter .14s}.answer:not(:disabled):hover{filter:brightness(1.2);transform:scale(1.01)}.answer .symbol{font-size:26px;background:#ffffff20;min-width:45px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:12px}.a0{background:#ce315a}.a1{background:#2979da}.a2{background:#b58420}.a3{background:#248b6c}.answer.selected{border-color:#fff;outline:3px solid #ffffff35}.answer.correct{border-color:#7effcc;box-shadow:0 0 0 2px #7effcc55}.answer.wrong{filter:grayscale(.7);opacity:.47}.subhead{color:var(--muted);font-weight:700;font-size:13px;margin:15px 0;text-align:center}
.leaders{display:grid;gap:10px}.leader{display:grid;grid-template-columns:45px 1fr auto;gap:8px;align-items:center;padding:13px 17px;background:#ffffff0b;border:1px solid #ffffff1e;border-radius:13px}.leader .rank{font-size:20px;font-weight:800;color:var(--yellow)}.leader strong{font-size:15px}.leader b{color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 350px;gap:20px}.notice{padding:18px;border:1px solid #ffffff23;background:#ffffff0c;border-radius:13px;margin:20px 0}.notice strong{color:var(--green)}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;margin-bottom:28px}.pod{padding:24px 10px;border-radius:17px;text-align:center;background:#251846;border:1px solid #ffffff28}.pod:nth-child(2){background:linear-gradient(#564092,#241844);border-color:#e3b75a}.pod em{font-style:normal;font-size:40px;display:block}.pod b{display:block;font-size:21px;overflow-wrap:anywhere}.pod span{color:var(--yellow);font-weight:800}.foot{display:flex;justify-content:space-between;gap:10px;padding:20px 0 25px;border-top:1px solid #ffffff12;color:#8e80b4;font-size:10px;letter-spacing:1px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f2e9ff;color:#301a5b;padding:13px 20px;border-radius:12px;font-weight:800;box-shadow:0 18px 36px #0007;z-index:9;display:none;max-width:90vw}
@media(max-width:760px){.hero,.lobbygrid,.grid2{grid-template-columns:1fr}.hero{min-height:0}.hero h1{font-size:43px}.tiles{grid-template-columns:repeat(3,1fr)}.panel{padding:20px}.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:74px}.qtitle{margin:14px auto 25px}.pin{font-size:56px;letter-spacing:4px}.foot{flex-wrap:wrap}.podium{gap:7px}.pod{padding:15px 5px}.pod b{font-size:13px}.pod em{font-size:31px}.tag{font-size:10px}main{padding-top:25px}}
</style></head><body>
<div class="wrap"><nav><a class="logo" href="/host">✦ QUIZ<b>ARENA</b></a><span class="pill"><span class="dot"></span>ПЕДАГОГИКА · LIVE</span></nav>
<main id="app"></main><footer class="foot"><span>YESSENOV · PEDAGOGY QUIZ</span><span>15 СҰРАҚ · 4 ЖАУАП · 1 ЖЕҢІМПАЗ</span></footer></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const app=document.getElementById('app'),role=location.pathname==='/host'?'host':'player';
let session=null,view=null,events=null,roomUrl='';
try{session=JSON.parse(sessionStorage.getItem('quiz-'+role)||'null');}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(s,extra='')=>'<span class="step"><span>'+esc(s)+'</span>'+extra+'</span>';
const score=x=>Number(x||0).toLocaleString('kk-KZ');
const action=(txt,fn,cl='')=>'<button class="btn '+cl+'" onclick="'+fn+'">'+txt+'</button>';
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',3200);}
async function request(route,data){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Қате');return j;}
function remember(s){session=s;sessionStorage.setItem('quiz-'+role,JSON.stringify(s));}
function reset(){session=null;view=null;if(events){events.close();events=null;}sessionStorage.removeItem('quiz-'+role);render();}
function landing(){
 const intro='<div class="tag">⚡ ЖЫЛДАМДЫҚ · БІЛІМ · ЖЕҢІС</div><h1>БІЛІМІҢДІ<br><span class="grad">СЫНАП КӨР.</span></h1><p>Педагогика пәнінен нағыз тікелей эфир викторинасы. 15 сұрақ, жылдамдыққа берілетін ұпай, QR арқылы қосылу және жеңімпаздар подиумы.</p><div class="tiles"><div class="tile"><b>15</b><small>СҰРАҚ</small></div><div class="tile"><b>150</b><small>ҚАТЫСУШЫҒА ДЕЙІН</small></div><div class="tile"><b>LIVE</b><small>РЕЙТИНГ</small></div></div>';
 const hostForm='<div class="orb">🏆</div><div class="tag">ЖҮРГІЗУШІ РЕЖИМІ</div><h2>Ойын бөлмесін аш</h2><p>PIN код пен QR автоматты жасалады. Қатысушылар жиналғаннан кейін өзің бастайсың.</p>'+action('✦ ОЙЫН ҚҰРУ','create()','block green');
 const playerForm='<div class="tag">ҚАТЫСУШЫ РЕЖИМІ</div><h2>Ойынға қосыл</h2><p>Жүргізушінің QR кодын сканерле немесе PIN енгіз.</p><div class="form"><label class="eyebrow">БӨЛМЕ PIN КОДЫ</label><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="123456" value="'+esc(new URLSearchParams(location.search).get('pin')||'')+'"><label class="eyebrow">АТЫҢ</label><input id="nameInput" maxlength="24" placeholder="Мысалы, Айдана" autocomplete="nickname" onkeydown="if(event.key===&quot;Enter&quot;)join()">'+action('ОЙЫНҒА КІРУ →','join()','block green')+'</div>';
 app.innerHTML='<section class="hero"><div>'+intro+'</div><div class="bigcard">'+(role==='host'?hostForm:playerForm)+'</div></section>';
}
async function create(){try{const g=await request('create',{});remember({pin:g.pin,token:g.token});roomUrl=g.joinUrl;connect();}catch(e){toast(e.message);}}
async function join(){const pin=document.getElementById('pinInput').value.trim(),name=document.getElementById('nameInput').value.trim();try{const g=await request('join',{pin,name});remember({pin:g.pin,token:g.token,name:g.name});connect();}catch(e){toast(e.message);}}
function connect(){
 if(events){events.close();events=null;}if(!session)return landing();
 const url='/api/events?'+new URLSearchParams({pin:session.pin,role,token:session.token}).toString();
 events=new EventSource(url);events.onmessage=e=>{try{view=JSON.parse(e.data);render();}catch{}};
 events.onerror=()=>{if(!view)refresh();};refresh();
}
async function refresh(){if(!session)return;try{const u='/api/state?'+new URLSearchParams({pin:session.pin,role,token:session.token});const r=await fetch(u),j=await r.json();if(!r.ok)throw Error(j.error);view=j;render();}catch(e){toast(e.message||'Байланыс үзілді');}}
async function command(name,extra={}){try{await request(name,Object.assign({pin:session.pin,token:session.token},extra));}catch(e){toast(e.message);}}
function shareLink(){const link=roomUrl||location.origin+'/?pin='+session.pin;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Сілтеме көшірілді!')).catch(()=>toast(link));else toast(link);}
function playerNames(){return (view.players||[]).map(p=>'<span class="name"><span class="avatar">'+esc(p.name.slice(0,1).toUpperCase())+'</span>'+esc(p.name)+'</span>').join('');}
function lobby(){
 if(role==='host'){
 const link=location.origin+'/?pin='+view.pin,qr='https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=10&data='+encodeURIComponent(link);
 app.innerHTML='<section class="stage"><div class="step"><span>01 · ОЙЫН БӨЛМЕСІ</span><span>LIVE LOBBY</span></div><h2>Қатысушыларды шақыр <span style="color:var(--green)">●</span></h2><div class="lobbygrid"><div class="panel" style="text-align:center"><div class="eyebrow">ОЙЫН PIN КОДЫ</div><div class="pin">'+view.pin+'</div><img class="qr" alt="Ойынға қосылу QR коды" src="'+qr+'"><small>QR кодты телефонмен сканерле</small><p class="link">'+esc(link)+'</p>'+action('🔗 СІЛТЕМЕНІ КӨШІРУ','shareLink()','secondary block')+'</div><div class="panel"><div class="tag">ҚАТЫСУШЫЛАР · '+view.participantCount+'</div><h2>Барлығы дайын ба?</h2><div class="namelist">'+(playerNames()||'<div class="empty">Қатысушылар қосылғанда есімдері осында шығады ✨</div>')+'</div>'+action('▶ ОЙЫНДЫ БАСТАУ','command(&quot;start&quot;)','green block')+'<p class="subhead">Қатысушылар жиналып болған соң баста</p></div></div></section>';
 }else{
 app.innerHTML='<section class="stage" style="max-width:650px;text-align:center"><div class="panel"><div class="orb">✨</div><div class="tag">СЕН ОЙЫНҒА ҚОСЫЛДЫҢ</div><h2>Сәлем, '+esc(view.personal?.name||session.name)+'!</h2><p>Жүргізуші ойынды бастағанша осы бетте қал.</p><div class="pin">'+view.pin+'</div><div class="notice">👥 Қатысушылар саны: <strong>'+view.participantCount+'</strong></div><div class="pill">⏳ Ойын басталуын күтудеміз</div></div></section>';
 }
}
function levelText(s){return s==='easy'?'🟢 ОҢАЙ · 1000 ҰПАЙ':s==='medium'?'🟡 ОРТАША · 1500 ҰПАЙ':'🔴 ҚИЫН · 2000 ҰПАЙ';}
function timerMarkup(q){const sec=Math.max(0,Math.ceil((q.endsAt-Date.now())/1000)),part=Math.max(0,Math.min(100,(q.endsAt-Date.now())/(q.duration*1000)*100));return {html:'<div id="timer" class="clock">'+sec+'</div>',bar:'<div class="bar"><div id="timerbar" style="width:'+part+'%"></div></div>'};}
function answers(q,reveal=false){
 const symbols=['◆','●','▲','■'],cls=['a0','a1','a2','a3'];
 return '<div class="answers">'+q.options.map((t,i)=>{const chosen=view.personal?.answer===i,correct=reveal&&view.stats?.correct===i,wrong=reveal&&!correct;
 return '<button class="answer '+cls[i]+(chosen?' selected':'')+(correct?' correct':'')+(wrong?' wrong':'')+'" '+(role==='host'||reveal||view.personal?.answer!==null&&view.personal?.answer!==undefined?'disabled':'onclick="answer('+i+')"')+'><span class="symbol">'+symbols[i]+'</span><span>'+esc(t)+(correct?' ✓':'')+'</span></button>';}).join('')+'</div>';
}
async function answer(choice){await command('answer',{choice});}
function leaderboard(){return (view.leaders||[]).map((p,i)=>'<div class="leader"><span class="rank">#'+p.rank+'</span><strong>'+esc(p.name)+'</strong><b>'+score(p.score)+' P</b></div>').join('')||'<p>Әзірге ұпай жоқ</p>';}
function question(){
 const q=view.question,t=timerMarkup(q);
 app.innerHTML='<section class="stage"><div class="qhead"><div class="step"><span>СҰРАҚ '+q.number+' / '+view.total+'</span><span>'+levelText(q.level)+'</span></div>'+t.html+'</div>'+t.bar+'<h2 class="qtitle">'+esc(q.text)+'</h2>'+answers(q,false)+'<p class="subhead">'+(role==='host'?'Жауап бергендер: '+view.answeredCount+' / '+view.participantCount:(view.personal?.answer===null?'Жауабыңды тез таңда! ⚡':'✅ Жауабың қабылданды. Нәтижені күт.'))+'</p></section>';
 tick();
}
function reveal(){
 const q=view.question,p=view.personal,correct=view.stats?.correct;
 const result=role==='player'?'<div class="notice" style="text-align:center"><h2>'+(p.wasCorrect?'🎉 ДҰРЫС ЖАУАП!':'💡 КЕЛЕСІДЕ СӘТТІЛІК!')+'</h2><strong>+'+score(p.roundGain)+' ҰПАЙ</strong><p>Жалпы ұпайың: '+score(p.score)+'</p></div>':'';
 app.innerHTML='<section class="stage"><div class="step"><span>СҰРАҚ '+q.number+' / 15 · НӘТИЖЕ</span><span>'+levelText(q.level)+'</span></div><h2 class="qtitle">'+esc(q.text)+'</h2><div class="grid2"><div>'+answers(q,true)+result+'<div class="notice"><strong>ДҰРЫС ЖАУАП: '+esc(q.options[correct])+'</strong><br><small>'+esc(view.stats.source)+'</small></div>'+(role==='host'?action(q.number===15?'🏆 ҚОРЫТЫНДЫНЫ КӨРСЕТУ':'КЕЛЕСІ СҰРАҚ →','command(&quot;next&quot;)','green block'):'<p class="subhead">Жүргізуші келесі сұрақты ашады</p>')+'</div><div class="panel"><div class="tag">🏆 LIVE TOP 10</div><h3>Көшбасшылар</h3><div class="leaders">'+leaderboard()+'</div></div></div></section>';
}
function finished(){
 const a=view.leaders||[],pod=a.slice(0,3),order=[pod[1],pod[0],pod[2]],em=['🥈','🥇','🥉'];
 app.innerHTML='<section class="stage" style="max-width:850px;text-align:center"><div class="tag">🏆 ЖЕҢІМПАЗДАР СӘТІ</div><h1>ОЙЫН <span class="grad">АЯҚТАЛДЫ!</span></h1><p>15 сұрақтың қорытындысы. Білімділер мен жылдамдар жеңіске жетті!</p><div class="podium">'+order.map((p,i)=>'<div class="pod"><em>'+em[i]+'</em><b>'+esc(p?.name||'—')+'</b><span>'+score(p?.score)+' P</span></div>').join('')+'</div><div class="panel" style="text-align:left"><div class="tag">ТОЛЫҚ РЕЙТИНГ</div><div class="leaders">'+leaderboard()+'</div></div>'+(role==='host'?'<div style="margin-top:24px">'+action('↻ ҚАЙТА ОЙНАУ','command(&quot;restart&quot;)','green')+'</div>':'<div class="notice">Жарайсың! Сенің орның: <strong>#'+view.personal?.rank+'</strong></div>')+'</section>';
}
function render(){if(!session||!view){landing();return;}if(view.phase==='lobby')lobby();else if(view.phase==='question')question();else if(view.phase==='reveal')reveal();else if(view.phase==='finished')finished();}
function tick(){const q=view?.question;if(!q||view?.phase!=='question')return;const diff=Math.max(0,q.endsAt-Date.now()),clock=document.getElementById('timer'),bar=document.getElementById('timerbar');if(clock)clock.textContent=Math.ceil(diff/1000);if(bar)bar.style.width=(diff/(q.duration*1000)*100)+'%';}
setInterval(tick,200);setInterval(()=>{if(session)refresh();},9000);
if(session)connect();else landing();
</script></body></html>
